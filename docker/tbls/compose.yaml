services:
  mariadb:
    image: mariadb:13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: trap_collection
      TZ: Asia/Tokyo
    command: mariadbd --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-ppass"]
      timeout: 5s
      interval: 10s
      retries: 10

  atlas:
    image: arigaio/atlas:latest
    command: ["migrate", "apply", "--config", "file://atlas.ci.hcl", "--env", "docker"]
    volumes:
      - ../../:/work
    working_dir: /work
    depends_on:
      mariadb:
        condition: service_healthy
  tbls:
    image: k1low/tbls:v1.97.0
    environment:
      TBLS_DSN: mariadb://root:pass@mariadb:3306/trap_collection
    volumes:
      - ../../:/work
    working_dir: /work
    command: doc --rm-dist -c .tbls.yml
    depends_on:
      mariadb:
        condition: service_healthy
      atlas:
        condition: service_completed_successfully
