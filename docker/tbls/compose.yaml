services:
  mariadb:
    image: mariadb:13.0.2@sha256:d4fdec0510ad498e4f3127da30a99df3745bd6d5e611ae6ac5f76403d9284a8d
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: trap_collection
      TZ: Asia/Tokyo
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppass"]
      timeout: 5s
      interval: 10s
      retries: 10

  atlas:
    image: arigaio/atlas:latest
    command: ["migrate", "apply", "--config", "file://atlas.ci.hcl", "--env", "docker"]
    volumes:
      - ../../:/work
    working_dir: /work
    depends_on:
      mariadb:
        condition: service_healthy
  tbls:
    image: k1low/tbls:v1.96.0
    environment:
      TBLS_DSN: mariadb://root:pass@mariadb:3306/trap_collection
    volumes:
      - ../../:/work
    working_dir: /work
    command: doc --rm-dist -c .tbls.yml
    depends_on:
      mariadb:
        condition: service_healthy
      atlas:
        condition: service_completed_successfully
